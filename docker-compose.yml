services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stacks
      POSTGRES_PASSWORD: stacks
      POSTGRES_DB: stacks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacks -d stacks"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
